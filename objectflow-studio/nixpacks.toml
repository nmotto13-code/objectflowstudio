# Railway/Nixpacks build configuration.
#
# Node 22, with pnpm installed VIA NPM rather than corepack. Why:
# corepack's wrapper for pnpm@11.5.0 (pnpm.cjs) uses a top-level
# dynamic import() that crashes with ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING
# on both Node 22.19 and Node 24.10. Bypassing the corepack shim
# entirely by `npm install -g pnpm@<version>` gives us the real pnpm
# binary with no wrapper layer — works reliably across Node majors.
#
# Build phase runs the tsup bundle for the worker (workspace-aware via
# pnpm filter). Start command lives in railway.json so it stays close
# to the health-check + restart-policy config.
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@11.5.0",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = ["pnpm --filter @objectflow/worker build"]
