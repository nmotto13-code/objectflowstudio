packages:
  - "apps/*"
  - "packages/*"

# Security overrides — force-bump transitive deps with known advisories.
# Each entry is `name@range: replacement`. Use the narrowest range that
# matches the vulnerable versions so unrelated trees aren't disturbed.
# Run `pnpm audit` after touching this list to verify coverage.
overrides:
  "undici@<6.24.0": "^6.24.0"
  "fast-uri@<3.1.2": "^3.1.2"
  "minimatch@>=10.0.0 <10.2.5": "^10.2.5"
  "smol-toml@<1.6.1": "^1.6.1"
  "srvx@<0.11.16": "^0.11.16"
  "ajv@>=7.0.0 <8.20.0": "^8.20.0"
  "postcss@<8.5.15": "^8.5.15"
  "jsondiffpatch@<0.7.6": "^0.7.6"
  # @sentry/nextjs declares rollup ^4.60.3 — must bump into v4 line, not 3.30.x
  "rollup@>=3.0.0 <3.30.0": "^4.60.3"
  "esbuild@<=0.24.2": "^0.25.0"
  "path-to-regexp@>=4.0.0 <6.3.0": "^6.3.0"
  "path-to-regexp@>=8.0.0 <8.4.2": "^8.4.2"
  "@opentelemetry/sdk-node@<0.218.0": "^0.218.0"
  "@opentelemetry/auto-instrumentations-node@<0.76.0": "^0.76.0"
  "ai@<5.0.52": "^5.0.52"
  # NOTE: @ai-sdk/provider-utils advisory cites patched >=3.0.98, but the v3
  # line stopped at 3.0.25 on npm. Accepted-low until upstream republishes.
  "@tootallnate/once@<2.0.1": "^2.0.1"
  "tar@<7.5.16": "^7.5.16"
  "uuid@<11.1.1": "^11.1.1"

# Approve postinstall build scripts. Native binaries we need; ML/proto stuff we don't.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  onnxruntime-node: false
  protobufjs: false
  '@sentry/cli': true
  '@sentry/profiling-node': true
  tesseract.js: true
  tree-sitter-c: true
  tree-sitter-cpp: true
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-lua: true
  tree-sitter-php: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
